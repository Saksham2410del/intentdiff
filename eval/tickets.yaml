# Evaluation tickets.
#
# gold      - a correct script for the ticket. Its effect on the database is the
#             ground truth; every other script is labelled by comparing effects.
# rewrites  - different SQL that should have the same effect (tests false alarms)
# bad       - hand-written mistakes that the automatic mutations don't cover
# expect: escalate - the ticket can't be done without asking the requester;
#             `script` is what an engineer might have written anyway
#
# Split is per ticket, so all variants of a ticket land in the same split.

- id: T01
  category: single_id
  split: dev
  ticket: |
    Client 1234 called - the email we have on file is out of date.
    New address: eva.novotna@gmail.com. Please update.
  gold: UPDATE client SET email = 'eva.novotna@gmail.com' WHERE client_id = 1234;
  rewrites:
    - UPDATE client SET email = 'eva.novotna@gmail.com' WHERE client_id IN (1234);

- id: T02
  category: single_id
  split: test
  ticket: |
    Please close account 676, customer request. Closing date 1998-12-31.
  gold: UPDATE account SET status = 'closed', closed_on = '1998-12-31' WHERE account_id = 676;
  rewrites:
    - UPDATE account SET closed_on = '1998-12-31', status = 'closed' WHERE account_id = 676 AND status = 'active';

- id: T03
  category: single_id
  split: dev
  ticket: |
    We don't have an email for client 2045. They gave petr.dvorak@seznam.cz
    at the branch today, please add it to their record.
  gold: UPDATE client SET email = 'petr.dvorak@seznam.cz' WHERE client_id = 2045;
  bad:
    - UPDATE client SET email = 'petr.dvorak@seznam.cz' WHERE client_id = 2054;

- id: T04
  category: id_list
  split: dev
  ticket: |
    Accounts 3818, 704 and 2378 have moved to the Kladno branch (district 4).
    Update the branch on those three accounts.
  gold: UPDATE account SET district_id = 4 WHERE account_id IN (3818, 704, 2378);
  rewrites:
    - |
      UPDATE account SET district_id = (SELECT district_id FROM district WHERE name = 'Kladno')
      WHERE account_id = 3818 OR account_id = 704 OR account_id = 2378;

- id: T05
  category: id_list
  split: test
  ticket: |
    Cards 1005, 104 and 747 were upgraded to gold at the branch last week but the
    system still shows classic. Please fix the card type.
  gold: UPDATE card SET type = 'gold' WHERE card_id IN (1005, 104, 747);
  bad:
    - UPDATE card SET type = 'gold' WHERE card_id IN (1005, 1004, 747);

- id: T06
  category: predicate
  split: dev
  ticket: |
    Collections has closed out the old bad loans. Every loan that is still marked
    running_in_debt and was granted before 1995-01-01 should now be finished_unpaid.
  gold: |
    UPDATE loan SET status = 'finished_unpaid'
    WHERE status = 'running_in_debt' AND granted_on < '1995-01-01';

- id: T07
  category: predicate
  split: test
  ticket: |
    The old gold card product is discontinued. Any gold card issued before
    1995-01-01 needs to be changed to classic.
  gold: UPDATE card SET type = 'classic' WHERE type = 'gold' AND issued_on < '1995-01-01';
  rewrites:
    - UPDATE card SET type = 'classic' WHERE issued_on <= '1994-12-31' AND type = 'gold';

- id: T08
  category: predicate
  split: dev
  ticket: |
    Accounts held at the Prague branch (district 1) that get a statement after
    every transaction should be switched to monthly statements.
  gold: |
    UPDATE account SET frequency = 'monthly'
    WHERE district_id = 1 AND frequency = 'after_transaction';

- id: T09
  category: relative_value
  split: dev
  ticket: |
    Loan 4988 has been restructured: extend it by 12 months. The monthly payment
    stays the same.
  gold: UPDATE loan SET duration_months = duration_months + 12 WHERE loan_id = 4988;
  rewrites:
    - UPDATE loan SET duration_months = 48 WHERE loan_id = 4988;
  bad:
    - UPDATE loan SET duration_months = 12 WHERE loan_id = 4988;

- id: T10
  category: relative_value
  split: test
  ticket: |
    The insurance standing order on account 37 goes up by 10% from next month.
    Round the new amount to whole crowns.
  gold: |
    UPDATE standing_order SET amount = ROUND(amount * 1.1)
    WHERE account_id = 37 AND purpose = 'insurance';
  rewrites:
    - |
      UPDATE standing_order SET amount = ROUND(amount * 110 / 100.0)
      WHERE account_id = 37 AND purpose = 'insurance';

- id: T11
  category: join
  split: dev
  ticket: |
    New rule for elderly customers: accounts whose owner was born before
    1920-01-01 should get weekly statements.
  gold: |
    UPDATE account SET frequency = 'weekly'
    WHERE account_id IN (
        SELECT d.account_id FROM disp d JOIN client c ON c.client_id = d.client_id
        WHERE d.type = 'owner' AND c.birth_date < '1920-01-01'
    );
  bad:
    # forgets that only the owner counts
    - |
      UPDATE account SET frequency = 'weekly'
      WHERE account_id IN (
          SELECT d.account_id FROM disp d JOIN client c ON c.client_id = d.client_id
          WHERE c.birth_date < '1920-01-01'
      );

- id: T12
  category: join
  split: test
  ticket: |
    Junior cards are only for clients under 21. Every junior card whose holder
    was born on or before 1977-12-31 must be switched to a classic card.
  gold: |
    UPDATE card SET type = 'classic'
    WHERE type = 'junior' AND disp_id IN (
        SELECT d.disp_id FROM disp d JOIN client c ON c.client_id = d.client_id
        WHERE c.birth_date <= '1977-12-31'
    );

- id: T13
  category: delete
  split: dev
  ticket: |
    There are still leasing standing orders sitting on closed accounts.
    Please delete the leasing standing orders that belong to closed accounts.
  gold: |
    DELETE FROM standing_order
    WHERE purpose = 'leasing'
      AND account_id IN (SELECT account_id FROM account WHERE status = 'closed');
  bad:
    - DELETE FROM standing_order WHERE purpose = 'leasing';

- id: T14
  category: delete
  split: test
  ticket: |
    Transaction 3346 on account 14 is a duplicate posting of the April payment.
    Please remove it.
  gold: DELETE FROM trans WHERE trans_id = 3346;
  bad:
    - DELETE FROM trans WHERE account_id = 14 AND amount = 14758;

- id: T15
  category: exclusion
  split: dev
  ticket: |
    Classic cards issued in November 1998 are part of the gold promotion - change
    them to gold. Exception: cards held by a secondary user of the account (not
    the owner) stay classic.
  gold: |
    UPDATE card SET type = 'gold'
    WHERE type = 'classic'
      AND issued_on BETWEEN '1998-11-01' AND '1998-11-30'
      AND disp_id IN (SELECT disp_id FROM disp WHERE type = 'owner');
  bad:
    - |
      UPDATE card SET type = 'gold'
      WHERE type = 'classic' AND issued_on BETWEEN '1998-11-01' AND '1998-11-30';

- id: T16
  category: exclusion
  split: test
  ticket: |
    Upgrade all classic cards on accounts held at the Prague branch (district 1)
    to gold, except where the account's loan is running_in_debt.
  gold: |
    UPDATE card SET type = 'gold'
    WHERE type = 'classic'
      AND disp_id IN (
          SELECT d.disp_id FROM disp d JOIN account a ON a.account_id = d.account_id
          WHERE a.district_id = 1
      )
      AND disp_id NOT IN (
          SELECT d.disp_id FROM disp d JOIN loan l ON l.account_id = d.account_id
          WHERE l.status = 'running_in_debt'
      );

- id: T17
  category: date_boundary
  split: dev
  ticket: |
    The penalty interest on account 7418 between 1997-01-01 and 1997-06-30
    (both days included) was booked under the wrong code. Change the purpose of
    those transactions from penalty_interest to interest.
  gold: |
    UPDATE trans SET purpose = 'interest'
    WHERE account_id = 7418 AND purpose = 'penalty_interest'
      AND date BETWEEN '1997-01-01' AND '1997-06-30';
  bad:
    # string dates without zero padding compare wrongly in SQLite
    - |
      UPDATE trans SET purpose = 'interest'
      WHERE account_id = 7418 AND purpose = 'penalty_interest'
        AND date >= '1997-1-1' AND date <= '1997-6-30';

- id: T18
  category: date_boundary
  split: test
  ticket: |
    Collections recovered the money on all loans granted before 1994-01-01 that
    are still marked finished_unpaid. Set those to finished_ok.
  gold: |
    UPDATE loan SET status = 'finished_ok'
    WHERE status = 'finished_unpaid' AND granted_on < '1994-01-01';

- id: T19
  category: null_handling
  split: dev
  ticket: |
    Client 10 asked us to delete their phone number from our records (GDPR request).
  gold: UPDATE client SET phone = NULL WHERE client_id = 10;
  bad:
    - UPDATE client SET phone = '' WHERE client_id = 10;

- id: T20
  category: null_handling
  split: test
  ticket: |
    The mailing job keeps failing on clients without an email. For clients living
    in district 13 (Rakovnik) who have no email on file, put the placeholder
    unknown@bank.cz.
  gold: UPDATE client SET email = 'unknown@bank.cz' WHERE district_id = 13 AND email IS NULL;
  bad:
    # "= NULL" never matches anything
    - UPDATE client SET email = 'unknown@bank.cz' WHERE district_id = 13 AND email = NULL;

- id: T21
  category: multi_statement
  split: dev
  ticket: |
    Account 3 is being closed as of 1998-12-31. Close the account and delete all
    of its standing orders.
  gold: |
    UPDATE account SET status = 'closed', closed_on = '1998-12-31' WHERE account_id = 3;
    DELETE FROM standing_order WHERE account_id = 3;

- id: T22
  category: multi_statement
  split: test
  ticket: |
    Loan 5060 was paid off early. Mark it finished_ok and delete the loan_payment
    standing order on its account (426). The other standing orders stay.
  gold: |
    UPDATE loan SET status = 'finished_ok' WHERE loan_id = 5060;
    DELETE FROM standing_order WHERE account_id = 426 AND purpose = 'loan_payment';
  bad:
    - |
      UPDATE loan SET status = 'finished_ok' WHERE loan_id = 5060;
      DELETE FROM standing_order WHERE account_id = 426;

- id: T23
  category: insert
  split: dev
  ticket: |
    Please set up a new standing order on account 1: 2452 CZK for household
    payments to account 87144583 at bank YZ.
  gold: |
    INSERT INTO standing_order (account_id, bank_to, account_to, amount, purpose)
    VALUES (1, 'YZ', '87144583', 2452, 'household');

- id: T24
  category: no_op
  split: test
  ticket: |
    Customer says the phone number for client 1234 is wrong. We checked, it should
